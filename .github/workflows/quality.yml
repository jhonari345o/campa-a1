name: Quality and security gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/integracion-supabase-datos
      - claude/adsmaiber-website-admin-9xc3cv

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run security:deps
